buildscript {
    dependencies {
        classpath("org.flywaydb:flyway-mysql:12.6.2")
    }
}

plugins {
    id 'java'
    id 'org.flywaydb.flyway' version '12.6.2'
    id 'org.springframework.boot' version '3.5.14'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'kr.or.kaptnet'
version = '0.0.1-SNAPSHOT'
description = 'kapanet spring-boot'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.5'
    implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.8'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jdk8'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
    implementation 'com.auth0:java-jwt:4.4.0'

    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    runtimeOnly 'com.mysql:mysql-connector-j'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
    useJUnitPlatform()
}

flyway {
    // ============================================================================
    // Flyway 데이터베이스 마이그레이션 설정
    // ============================================================================
    // 목적: 수동 데이터베이스 마이그레이션을 위한 Flyway Gradle 플러그인 설정
    //
    // 데이터베이스 연결:
    //   URL: UTF-8 인코딩과 서울 시간대를 사용하는 MySQL 데이터베이스
    //   자격증명: 로컬 개발용 자격증명 (root/root)
    //   참고: 운영 환경에서는 하드코딩된 값 대신 환경 변수 사용 권장
    //   예: user = System.getenv("DB_USER") ?: 'root'
    // ============================================================================

    // 데이터베이스 연결 URL
    // - UTF-8 문자 인코딩을 사용하는 MySQL 8.x JDBC URL
    // - 서버 시간대: Asia/Seoul
    // - allowPublicKeyRetrieval=true: MySQL 8.x 인증에 필요
    // - useSSL=false: 로컬 개발용으로 비활성화 (운영 환경에서는 활성화 권장)
    url = 'jdbc:mysql://localhost:3336/sample?characterEncoding=UTF-8&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true&useSSL=false'

    // 데이터베이스 자격증명
    // - 로컬 개발용 자격증명
    // - TODO: 운영 배포 시 환경 변수로 대체 필요
    user = 'root'
    password = 'root'

    // 마이그레이션 스크립트 위치
    // - classpath:db/migration: 리소스의 SQL 마이그레이션 스크립트 표준 위치
    // - Flyway가 이 디렉토리의 SQL 파일을 자동으로 발견하고 실행
    // - 여러 위치 지원 가능: ['classpath:db/migration', 'filesystem:flyway/sql']
    locations = ['filesystem:src/main/resources/db/migration']

    // SQL 스크립트 문자 인코딩
    // - UTF-8: 국제 문자와 한국어 텍스트 지원
    // - 다양한 운영체제에서 일관된 인코딩 보장
    encoding = 'UTF-8'

    // 마이그레이션 시 검증
    // - true: 마이그레이션 실행 전 검증 수행
    // - 이미 적용된 마이그레이션의 체크섬 확인
    // - 이전에 적용된 마이그레이션 스크립트의 우연한 변경 감지
    // - 수정된 마이그레이션 파일로 인한 데이터 손상 방지
    validateOnMigrate = true

    // SQL 스크립트의 플레이스홀더 치환
    // - true: 플레이스홀더 치환 활성화 (예: ${name})
    // - 마이그레이션 스크립트에서 환경별 값 사용 가능
    // - 예: INSERT INTO config (key, value) VALUES ('env', '${env}')
    placeholderReplacement = true

    // 순서가 맞지 않는 마이그레이션
    // - true: 순서대로 않은 마이그레이션 적용 허용
    // - 여러 개발자가 마이그레이션을 생성할 때 개발 환경에서 유용
    // - 예: V2__new_feature.sql이 V3__old_feature.sql보다 먼저 적용
    // - 개발용으로 권장, 운영 환경의 엄격성을 위해 false로 설정
    outOfOrder = true

    // Clean 작업 비활성화
    cleanDisabled = false

    // ============================================================================
    // 추가 설정 옵션 (필요 시 주석 해제):
    // ============================================================================
    // // 플레이스홀더 접두사와 접미사 (기본값: ${ })
    // placeholderPrefix = '${'
    // placeholderSuffix = '}'
    //
    // // 마이그레이션할 대상 버전 (기본값: 최신 버전)
    // target = '1.2'  // 주석 해제 시 버전 1.2까지만 마이그레이션
    //
    // // SQL 마이그레이션 구분자 (기본값: __)
    // sqlMigrationSeparator = '__'
    //
    // // SQL 마이그레이션 접두사 (기본값: V)
    // sqlMigrationPrefix = 'V'
    //
    // // 반복 가능한 마이그레이션 접두사 (기본값: R)
    // repeatableSqlMigrationPrefix = 'R'
    //
    // // 기본 콜백 건너뛰기 (기본값: false)
    // skipDefaultCallbacks = false
    //
    // // 혼합 마이그레이션 모드 (버전 + 반복 가능)
    // mixed = true
    // ============================================================================
}
