spring:
  flyway:
    enabled: false  # 수동 실행만 - 시작 시 자동 마이그레이션 비활성화
    validate-on-migrate: true
    locations: classpath:db/migration
    placeholder-replacement: true

springdoc:
  packages-to-scan: kr.go.kaptnet
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
  api-docs:
    path: /api/public/api-docs/json
  swagger-ui:
    path: /public/swagger-ui
    disable-swagger-default-url: true #기본 Swagger Petstore URL을 어떻게 비활성화
    display-request-duration: true # API 응답 시간의 표시
    operations-sorter: alpha

kapa:
  domain:
    datasource:
      poolName: platform-domain-cp
      type: com.zaxxer.hikari.HikariDataSource
      driverClassName: com.mysql.cj.jdbc.Driver
      jdbcUrl: "jdbc:mysql://localhost:3336/sample?characterEncoding=UTF-8&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true&useSSL=false"
      username: root
      password: root
      auto-commit: false
      connectionTimeout: 30000
      maxLifetime: 1800000
      maximumPoolSize: 15

logging:
  level:
    kr.go.kaptnet: DEBUG