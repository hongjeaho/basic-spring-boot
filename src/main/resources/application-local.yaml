spring:
  flyway:
    enabled: false  # 수동 실행만 - 시작 시 자동 마이그레이션 비활성화
    validate-on-migrate: true
    locations: classpath:db/migration
    placeholder-replacement: true

kapa:
  domain:
    datasource:
      poolName: platform-domain-cp
      type: com.zaxxer.hikari.HikariDataSource
      driverClassName: com.mysql.cj.jdbc.Driver
      jdbcUrl: "jdbc:mysql://localhost:3336/sample?characterEncoding=UTF-8&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true&useSSL=false"
      username: root
      password: root
      auto-commit: false
      connectionTimeout: 30000
      maxLifetime: 1800000
      maximumPoolSize: 15

logging:
  level:
    kr.go.kaptnet: DEBUG